[project]
name = "grocery-shrinkflation-monitor"
version = "0.1.0"
description = "Tracks shrinkflation across Canadian grocery chains."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "fastapi>=0.115.0",
    "email-validator>=2.2.0",
    "pandas>=2.2.2",
    "psycopg[binary]>=3.2.1",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "redis>=5.0.8",
    "sqlalchemy>=2.0.32",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.6",
    "sentry-sdk[fastapi]>=2.19.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.2",
    "pyright>=1.1.378",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "scraper*", "insights*", "workers*"]
exclude = ["frontend*", "db*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.11"
include = ["api", "scraper", "insights", "workers"]
typeCheckingMode = "basic"
